<div class="container">
  <div class="card mb-3">
    <div class="card-header text-center text-primary">
      <h5 class="card-title">Operaciones</h5>
    </div>
    <div class="card-body text-primary">
      <form>
        <div class="mb-3">
          <label for="numeroUno" class="form-label">N&uacute;mero uno</label>
          <input type="number" class="form-control" id="numeroUno" name="numeroUno" step="1" min="1" max="100" [(ngModel)] = "numeroUno"/>
        </div>
        <div class="mb-3">
          <label for="numeroDos" class="form-label">N&uacute;mero dos</label>
          <input type="number" class="form-control" id="numeroDos" name="numeroDos" step="1" min="1" max="100" [(ngModel)] = "numeroDos"/>
        </div>
        <div class="mb-3">
          <button type="button" class="btn btn-outline-primary" (click)="sumar()">Suma</button>
          <button type="button" class="btn btn-outline-danger" (click)="restar()">Resta</button>
          <button type="button" class="btn btn-outline-success" (click)="multiplicar()">Multiplicaci&oacute;n</button>
          <button type="button" class="btn btn-outline-info" (click)="dividir()">Divisi&oacute;n</button>
        </div>
      </form>
    </div>
    <div class="card-footer text-info text-center">
        <i>El resultado es {{ resultado }}</i>
    </div>
  </div>
</div>
